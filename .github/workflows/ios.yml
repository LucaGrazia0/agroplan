name: AgroPlan IPA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'scripts/build_ios.py'
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.*'
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Build compact Release IPA
        run: python3 scripts/build_ios.py
      - name: Record package size
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          info = json.loads(Path('build/ios/ipa/AgroPlan-build.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"AgroPlan.ipa: **{info['size_mib']} MiB**, Release arm64, non firmata.\n\n")
              summary.write('Da firmare e installare tramite iLoader/AltStore. Server HTTPS configurabile al primo avvio.\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: AgroPlan-IPA
          path: build/ios/ipa/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: AgroPlan-debug-symbols
          path: build/ios-symbols/
          if-no-files-found: error
          retention-days: 7
